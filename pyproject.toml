[tool.bumpversion]
current_version = "1.8.2"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
ignore_missing_files = false
tag = true
sign_tags = false
tag_name = "v{new_version}"
tag_message = "chore(release): bump version to v{new_version}"
allow_dirty = true
commit = true
message = "chore(release): bump version to v{new_version}"
commit_args = ""

[[tool.bumpversion.files]]
filename = "pkg/mops/cli.go"

[[tool.bumpversion.files]]
filename = "gui/src-tauri/tauri.conf.json"

[[tool.bumpversion.files]]
filename = "gui/src-tauri/Cargo.toml"

[[tool.bumpversion.files]]
filename = "gui/package.json"

[[tool.bumpversion.files]]
filename = "gui/src/App.svelte"
